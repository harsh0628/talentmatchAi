services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: talentmatch
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/talentmatch
      CLIENT_URL: http://localhost:5173
      SESSION_COOKIE_NAME: tm_session
      SESSION_MAX_AGE_MS: 604800000
      SESSION_COOKIE_SECURE: "false"
      AUTH_MAX_FAILED_LOGIN_ATTEMPTS: 5
      AUTH_LOCKOUT_MINUTES: 30
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-20000}
      AI_ENABLE_HEURISTIC_FALLBACK: ${AI_ENABLE_HEURISTIC_FALLBACK:-true}
    ports:
      - "5000:5000"
    networks:
      default:
        aliases:
          - talentmatch-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mongodb-data:
