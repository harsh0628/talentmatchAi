#cloud-config
package_update: true
packages:
  - git
  - ca-certificates
  - curl
  - gnupg
runcmd:
  - curl -fsSL https://get.docker.com | sh
  - apt-get update
  - apt-get install -y docker-compose-plugin
  - usermod -aG docker azureuser
  - systemctl enable docker
  - |
      mkdir -p /opt/talentmatch
      git clone --branch __REPO_BRANCH__ __REPO_URL__ /opt/talentmatch
      cat > /opt/talentmatch/.env <<EOF
      MONGODB_URI=__MONGODB_URI__
      CLIENT_URL=__CLIENT_URL__
      JWT_ACCESS_SECRET=__JWT_ACCESS_SECRET__
      JWT_REFRESH_SECRET=__JWT_REFRESH_SECRET__
      GEMINI_API_KEY=__GEMINI_API_KEY__
      EOF
      cd /opt/talentmatch
      bash infrastructure/azure/vm/deploy-on-vm.sh
